<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Upload</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">FILE UPLOAD</p>
    <h1>Gửi file nhanh</h1>
    <p class="hint">Chọn nhiều file. Mỗi file có tiến độ riêng và có thể pause, resume hoặc stop.</p>

    <label class="token-field" for="upload-token">
      Upload token
      <input id="upload-token" type="password" autocomplete="off" placeholder="Nhập token để upload">
    </label>

    <label class="picker" id="drop-zone" for="file-input">
      <span class="picker-icon">↑</span>
      <span><strong>Chọn file</strong> hoặc kéo thả vào đây</span>
      <small>Có thể chọn nhiều file · tối đa 3 file truyền đồng thời</small>
      <input id="file-input" type="file" multiple hidden>
    </label>

    <section id="upload-panel" class="upload-panel" hidden aria-live="polite" aria-label="Danh sách upload">
      <div class="upload-heading">
        <h2>Đang gửi file</h2>
        <span id="upload-count"></span>
      </div>
      <div id="upload-list" class="upload-list"></div>
    </section>

    <p id="status" class="status" role="status"></p>
  </main>
  <script src="/site.js"></script>
</body>
</html>
