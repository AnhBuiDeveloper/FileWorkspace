<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Workspace</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <main class="card">
    <div class="top-line">
      <p class="eyebrow">FILE WORKSPACE</p>
      <label class="language-picker" for="language-select">
        <span class="sr-only" data-i18n="languageLabel">Ngôn ngữ</span>
        <select id="language-select" aria-label="Ngôn ngữ">
          <option value="vi">Tiếng Việt</option>
          <option value="en">English</option>
        </select>
      </label>
    </div>
    <h1 data-i18n="title">Gửi file nhanh</h1>
    <p class="hint" data-i18n="hint">Chọn nhiều file. Mỗi file có tiến độ riêng và có thể pause, resume hoặc stop.</p>

    <div class="token-field">
      <div class="token-heading">
        <label for="upload-token" data-i18n="tokenLabel">Upload token</label>
        <button id="logout-button" class="logout-button" type="button" hidden data-i18n="logout">Logout</button>
      </div>
      <input id="upload-token" type="password" autocomplete="off" data-i18n-placeholder="tokenPlaceholder" placeholder="Nhập token để upload">
    </div>

    <input id="file-input" type="file" multiple hidden>
    <input id="folder-input" type="file" webkitdirectory directory multiple hidden>

    <section id="files-panel" class="file-manager" hidden aria-live="polite" aria-label="Files">
      <div class="manager-heading">
        <div>
          <p class="section-kicker" data-i18n="fileManagerKicker">FILE MANAGER</p>
          <h2 data-i18n="filesTitle">File của bạn</h2>
        </div>
        <div class="manager-actions">
          <button id="new-folder" class="action-button secondary" type="button" data-i18n="newFolder">Tạo folder</button>
          <button id="upload-files" class="action-button primary" type="button" data-i18n="uploadFiles">Upload file</button>
          <button id="upload-folder" class="action-button primary" type="button" data-i18n="uploadFolder">Upload folder</button>
          <button id="refresh-files" class="icon-button" type="button" data-i18n-title="refreshFiles" data-i18n-aria-label="refreshFiles" aria-label="Làm mới">↻</button>
        </div>
      </div>

      <div id="drop-zone" class="drop-zone" tabindex="0" role="button" data-i18n-aria-label="dropZoneLabel">
        <span class="drop-zone-icon">↑</span>
        <span data-i18n="dropZoneText">Kéo thả file vào đây để upload vào folder hiện tại</span>
      </div>

      <nav id="breadcrumbs" class="breadcrumbs" aria-label="Current folder"></nav>
      <p id="files-status" class="files-status"></p>
      <div id="files-list" class="files-list" role="list"></div>
    </section>

    <section id="upload-panel" class="upload-panel" hidden aria-live="polite" aria-label="Danh sách upload">
      <div class="upload-heading">
        <h2 data-i18n="uploadListTitle">Đang gửi file</h2>
        <span id="upload-count"></span>
      </div>
      <div id="upload-list" class="upload-list"></div>
    </section>

    <p id="status" class="status" role="status"></p>
  </main>
  <dialog id="create-folder-dialog" class="folder-dialog">
    <form id="create-folder-form" method="dialog">
      <div class="dialog-heading">
        <h2 data-i18n="newFolder">Tạo folder</h2>
        <button id="close-folder-dialog" class="icon-button" type="button" aria-label="Close">×</button>
      </div>
      <label class="dialog-label" for="folder-name" data-i18n="folderName">Tên folder</label>
      <input id="folder-name" name="folder-name" type="text" maxlength="120" autocomplete="off" required>
      <p id="folder-dialog-status" class="dialog-status" role="status"></p>
      <div class="dialog-actions">
        <button id="cancel-folder-dialog" class="action-button secondary" type="button" data-i18n="cancel">Hủy</button>
        <button class="action-button primary" type="submit" data-i18n="createFolder">Tạo folder</button>
      </div>
    </form>
  </dialog>
  <script src="/site.js"></script>
</body>
</html>
